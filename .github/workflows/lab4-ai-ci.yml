name: Lab 4 AI CI

on:
  pull_request:
    branches:
      - lab3-ai-engineer-prototype
      - main

permissions:
  contents: read

jobs:
  tests-and-mock:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-ai.txt
      - run: python -m pip install -r requirements-ai.txt
      - run: python -m pytest -q
      - run: python -m ml.experiments.lab4 --mode mock --output var/ci-lab4-mock
      - uses: actions/upload-artifact@v4
        with:
          name: lab4-mock-${{ github.run_id }}
          path: var/ci-lab4-mock
          if-no-files-found: error

  real-model-ab:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MODEL_SHA256: fec9d28c7f8dab7c6857d54b56c8264cce57d6f6d9003bd4110f6457f071c65a
      ENGINE_SHA256: ffaf53f17a4601493e6ffb5869c9f0c7d400bb7e124fe0096eee3b65a5862568
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-ai.txt
      - run: python -m pip install -r requirements-ai.txt
      - name: Download and verify model and engine
        shell: bash
        run: |
          mkdir -p var/llama
          curl --fail --location --retry 3 --max-time 300 \
            'https://github.com/ggml-org/llama.cpp/releases/download/b12292/llama-b12292-bin-ubuntu-x64.tar.gz' \
            -o var/llama/engine.tar.gz
          curl --fail --location --retry 3 --max-time 420 \
            'https://huggingface.co/bartowski/mistralai_Ministral-3-3B-Instruct-2512-GGUF/resolve/0a9035302dea19872c96076896304552890a73c2/mistralai_Ministral-3-3B-Instruct-2512-Q4_K_M.gguf' \
            -o var/llama/model.gguf
          printf '%s  %s\n' "$ENGINE_SHA256" var/llama/engine.tar.gz \
            "$MODEL_SHA256" var/llama/model.gguf | sha256sum --check
          tar -xzf var/llama/engine.tar.gz -C var/llama
      - name: Generate A/B answers with Ministral 3B
        shell: bash
        run: |
          var/llama/llama-b12292/llama-server -m var/llama/model.gguf \
            --alias ministral-3b-2512 --host 127.0.0.1 --port 8087 \
            -c 4096 -t "$(nproc)" --parallel 1 --no-warmup > var/llama/server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            if curl -fsS --max-time 1 http://127.0.0.1:8087/health >/dev/null 2>&1; then
              break
            fi
            kill -0 "$server_pid"
            sleep 1
          done
          curl -fsS --max-time 2 http://127.0.0.1:8087/health
          python -m ml.experiments.lab4 --mode local \
            --engine-version 'llama.cpp b12292 af6b5243d' \
            --weights-sha256 "$MODEL_SHA256" --output var/ci-lab4-local
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lab4-local-ab-${{ github.run_id }}
          path: |
            var/ci-lab4-local
            var/llama/server.log
