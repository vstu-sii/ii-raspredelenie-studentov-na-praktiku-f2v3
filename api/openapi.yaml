openapi: 3.0.3
info:
  title: VKR AI — AI endpoints contract
  version: 2.0.0
  description: >
    Контракт AI-эндпоинтов проекта автоматизации ВКР.
    Основная генерация использует Mistral AI; локальный demo-режим не является AI fallback.
servers:
  - url: http://localhost:8000

tags:
  - name: Generation
    description: Генерация и перегенерация тем
  - name: Evaluation
    description: Оценка качества AI-результатов
  - name: Integration
    description: Проверка AI-провайдера

paths:
  /api/generate/selected:
    post:
      tags: [Generation]
      summary: Сгенерировать темы для выбранных преподавателей
      operationId: generateSelected
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenerateSelectedRequest'
            example:
              selections:
                - teacher_id: 84
                  count: 5
              focus: "многоагентные системы и автоматизация университетских процессов"
      responses:
        '200':
          description: Темы созданы и прошли локальную проверку
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerationResult'
        '404':
          description: Один из преподавателей не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Mistral не настроен / timeout / rate limit / AI generation failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/generate/selected/stream:
    post:
      tags: [Generation]
      summary: Массовая генерация с NDJSON-прогрессом
      operationId: generateSelectedStream
      description: >
        Каждый преподаватель обрабатывается отдельным коротким AI-запросом.
        Ответ — application/x-ndjson; каждая строка является одним GenerationStreamEvent.
        При ошибке AI локальный demo-банк не подмешивается.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenerateSelectedRequest'
      responses:
        '200':
          description: Поток start/progress/heartbeat/final/error
          content:
            application/x-ndjson:
              schema:
                type: string
                description: >
                  NDJSON stream. Каждая строка соответствует
                  #/components/schemas/GenerationStreamEvent.
              x-ndjson-item-schema:
                $ref: '#/components/schemas/GenerationStreamEvent'

  /api/topics/{topic_id}/regenerate:
    post:
      tags: [Generation]
      summary: Перегенерировать одну тему через AI
      operationId: regenerateTopic
      parameters:
        - name: topic_id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: Новая тема
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Topic'
        '404':
          description: Тема не найдена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Ошибка AI-провайдера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/evaluation/run:
    post:
      tags: [Evaluation]
      summary: Запустить оценку качества набора
      operationId: runEvaluation
      parameters:
        - name: batch_id
          in: query
          required: true
          schema:
            type: integer
            minimum: 1
        - name: reference_count
          in: query
          required: false
          schema:
            type: integer
            minimum: 50
            maximum: 100
            default: 80
      responses:
        '200':
          description: Метрики качества набора
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QualityEvaluation'
        '400':
          description: Некорректный reference_count или набор нельзя оценить
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Набор генерации не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/integrations/check/mistral:
    post:
      tags: [Integration]
      summary: Проверить доступность Mistral API
      operationId: checkMistral
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MistralCheckRequest'
      responses:
        '200':
          description: Состояние интеграции
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntegrationCheck'

components:
  schemas:
    GenerationSelection:
      type: object
      required: [teacher_id, count]
      additionalProperties: false
      properties:
        teacher_id:
          type: integer
          minimum: 1
        count:
          type: integer
          minimum: 1
          maximum: 50

    GenerateSelectedRequest:
      type: object
      required: [selections]
      additionalProperties: false
      properties:
        selections:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: '#/components/schemas/GenerationSelection'
        focus:
          type: string
          nullable: true
          maxLength: 1500

    GenerationResult:
      type: object
      required: [created, mode, topics]
      properties:
        created:
          type: integer
          minimum: 0
        mode:
          type: string
          example: mistral-ai
        topics:
          type: array
          items:
            $ref: '#/components/schemas/Topic'
        warning:
          type: string
          nullable: true
        batch_id:
          type: integer
          nullable: true

    Topic:
      type: object
      required:
        - id
        - teacher_id
        - teacher_name
        - teacher_contact
        - title
        - keywords
        - generation_source
        - profile_relevance_score
        - matched_research_areas
        - profile_directions
        - foreign_profile_directions
        - similarity_score
        - teacher_similarity_score
        - global_similarity_score
        - batch_similarity_score
        - similarity_method
        - quality_state
        - quality_reasons
        - status
        - manual_edit
        - created_at
        - updated_at
      properties:
        id:
          type: integer
        teacher_id:
          type: integer
        teacher_name:
          type: string
        teacher_contact:
          type: string
        title:
          type: string
          minLength: 8
          maxLength: 500
        rationale:
          type: string
          nullable: true
        keywords:
          type: array
          items:
            type: string
        generation_source:
          type: string
          enum: [mistral-ai, local-demo, legacy]
        generation_model:
          type: string
          nullable: true
          example: ministral-8b-2512
        profile_relevance_score:
          type: number
          format: float
          minimum: 0
          maximum: 100
        matched_research_areas:
          type: array
          items:
            type: string
        profile_directions:
          type: array
          items:
            type: string
        foreign_profile_directions:
          type: array
          items:
            type: string
        profile_relevance_method:
          type: string
        similarity_score:
          type: number
          format: float
          minimum: 0
          maximum: 100
        closest_past_topic:
          type: string
          nullable: true
        teacher_similarity_score:
          type: number
          format: float
        teacher_closest_topic:
          type: string
          nullable: true
        global_similarity_score:
          type: number
          format: float
        global_closest_topic:
          type: string
          nullable: true
        global_closest_teacher:
          type: string
          nullable: true
        batch_similarity_score:
          type: number
          format: float
        batch_closest_topic:
          type: string
          nullable: true
        batch_closest_teacher:
          type: string
          nullable: true
        similarity_method:
          type: string
          enum: [exact-duplicate, local-embedding, local-lexical, none]
        teacher_similarity_method:
          type: string
        global_similarity_method:
          type: string
        batch_similarity_method:
          type: string
        quality_state:
          type: string
          enum: [passed, review, blocked]
        quality_reasons:
          type: array
          items:
            type: string
        status:
          type: string
          enum: [draft, approved, rejected]
        manual_edit:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    GenerationStreamEvent:
      oneOf:
        - $ref: '#/components/schemas/StreamStart'
        - $ref: '#/components/schemas/StreamProgress'
        - $ref: '#/components/schemas/StreamHeartbeat'
        - $ref: '#/components/schemas/StreamFinal'
        - $ref: '#/components/schemas/StreamError'

    StreamStart:
      type: object
      required: [type, batch_id, total, created, completed_groups, total_groups, stage]
      properties:
        type:
          type: string
          enum: [start]
        batch_id:
          type: integer
        total:
          type: integer
        created:
          type: integer
        completed_groups:
          type: integer
        total_groups:
          type: integer
        stage:
          type: string
          enum: [generation]

    StreamProgress:
      type: object
      required: [type, batch_id, total, created, completed_groups, total_groups, stage]
      properties:
        type:
          type: string
          enum: [progress]
        batch_id:
          type: integer
        total:
          type: integer
        created:
          type: integer
        completed_groups:
          type: integer
        total_groups:
          type: integer
        stage:
          type: string
          enum: [generation, similarity]
        message:
          type: string
          nullable: true
        mode:
          type: string
          nullable: true

    StreamHeartbeat:
      type: object
      required: [type, batch_id, total, created, completed_groups, total_groups, stage, message]
      properties:
        type:
          type: string
          enum: [heartbeat]
        batch_id:
          type: integer
        total:
          type: integer
        created:
          type: integer
        completed_groups:
          type: integer
        total_groups:
          type: integer
        stage:
          type: string
          enum: [generation]
        message:
          type: string

    StreamFinal:
      type: object
      required: [type, batch_id, created, total, completed_groups, total_groups, stage, mode]
      properties:
        type:
          type: string
          enum: [final]
        batch_id:
          type: integer
        created:
          type: integer
        total:
          type: integer
        completed_groups:
          type: integer
        total_groups:
          type: integer
        stage:
          type: string
          enum: [done]
        mode:
          type: string
        warning:
          type: string
          nullable: true

    StreamError:
      type: object
      required: [type, message]
      properties:
        type:
          type: string
          enum: [error]
        batch_id:
          type: integer
          nullable: true
        message:
          type: string

    QualityEvaluation:
      type: object
      required: [id, batch_id, reference_count, topic_count, mode, metrics, items, created_at]
      properties:
        id:
          type: integer
        batch_id:
          type: integer
        reference_count:
          type: integer
        topic_count:
          type: integer
        mode:
          type: string
        metrics:
          type: object
          additionalProperties: true
        items:
          type: array
          items:
            $ref: '#/components/schemas/QualityEvaluationItem'
        created_at:
          type: string
          format: date-time

    QualityEvaluationItem:
      type: object
      required: [topic_id, title, teacher_name, teacher_fit, specificity, practicality, novelty, overall]
      properties:
        topic_id:
          type: integer
        title:
          type: string
        teacher_name:
          type: string
        teacher_fit:
          type: number
        specificity:
          type: number
        practicality:
          type: number
        novelty:
          type: number
        overall:
          type: number

    MistralCheckRequest:
      type: object
      properties:
        api_key:
          type: string
          nullable: true
          maxLength: 1000
        chat_model:
          type: string
          nullable: true
          maxLength: 255
        embedding_model:
          type: string
          nullable: true
          maxLength: 255

    IntegrationCheck:
      type: object
      required: [status, message]
      properties:
        status:
          type: string
          enum: [unconfigured, connected, error]
        message:
          type: string
        detail:
          type: string
          nullable: true

    Error:
      type: object
      properties:
        detail:
          type: string
