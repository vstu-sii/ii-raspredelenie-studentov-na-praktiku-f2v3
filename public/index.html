<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ВКР-трекер</title>
<style>
  body { font-family: system-ui, sans-serif; background: #0d1117; color: #e6edf3;
         display: flex; min-height: 100vh; align-items: center; justify-content: center; margin: 0; }
  .card { background: #161b22; border: 1px solid #30363d; border-radius: 12px;
          padding: 48px 64px; max-width: 560px; }
  h1 { margin: 0 0 8px; font-size: 28px; }
  p  { margin: 4px 0; color: #8b949e; }
  .ok { color: #3fb950; font-weight: 700; }
  code { background: #21262d; padding: 2px 8px; border-radius: 6px; color: #79c0ff; }
</style>
</head>
<body>
<div class="card">
  <h1>ВКР-трекер</h1>
  <p><span class="ok">● status: ok</span> — прод жив с недели 1</p>
  <p>Заглушка hello-world (Lab 1, GitHub Pages).</p>
  <p>Стек: FastAPI + Docker — бэкенд подключается на следующих лабах.</p>
  <p>Проверка живости: <code>status: ok</code> на этой странице.</p>
</div>
</body>
</html>
