services:
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      APP_ENV: dev
      DATABASE_URL: postgresql://dev:dev@db:5432/vkr
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - vkr-net

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: vkr
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dev -d vkr"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - vkr-net

  worker-email:
    build: .
    command: ["python", "-m", "app.workers.email_worker"]
    environment:
      APP_ENV: dev
      DATABASE_URL: postgresql://dev:dev@db:5432/vkr
    depends_on:
      db:
        condition: service_healthy
      app:
        condition: service_started
    networks:
      - vkr-net

  worker-bot:
    build: .
    command: ["python", "-m", "app.workers.bot_worker"]
    environment:
      APP_ENV: dev
      DATABASE_URL: postgresql://dev:dev@db:5432/vkr
    depends_on:
      db:
        condition: service_healthy
      app:
        condition: service_started
    networks:
      - vkr-net

volumes:
  pgdata:

networks:
  vkr-net:
    driver: bridge